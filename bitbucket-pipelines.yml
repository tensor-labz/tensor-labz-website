image: node:18

definitions:
  steps:
    - step: &update-production
        name: Update Production Branch
        script:
          # Configure git with pipeline credentials
          - git config user.name "Bitbucket Pipeline"
          - git config user.email "pipeline@bitbucket.org"
          
          # Fetch all branches
          - git fetch --all
          
          # Switch to production branch (create if doesn't exist)
          - git checkout production || git checkout -b production
          
          # Reset production to match main exactly
          - git reset --hard origin/main
          
          # Push to production branch
          - git push origin production --force
          
          # Optional: Create a tag with timestamp
          - export TAG_NAME="prod-$(date +%Y%m%d-%H%M%S)"
          - git tag $TAG_NAME
          - git push origin $TAG_NAME
          
          - echo "✅ Production branch updated successfully"
          - echo "🏷️  Created tag: $TAG_NAME"
    
    - step: &build-and-test
        name: Build and Test
        caches:
          - node
        script:
          - npm install
          - npm run build
          - npm run test
        artifacts:
          - dist/**
          - build/**

pipelines:
  # Trigger when merging to main branch
  branches:
    main:
      - step: *build-and-test
      - step: *update-production
  
  # Optional: Manual trigger for production update
  custom:
    update-production-manual:
      - step: *update-production
  
  # Optional: Run tests on feature branches
  feature/*:
    - step: *build-and-test
  
  # Optional: Handle pull requests
  pull-requests:
    '**':
      - step: *build-and-test

