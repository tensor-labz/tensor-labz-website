name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Mirror to Bitbucket → Amplify builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH for Bitbucket
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BITBUCKET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts

      - name: Push to Bitbucket (triggers Amplify build)
        run: |
          git remote add bitbucket git@bitbucket.org:thanumahee12/tensor-labz-website.git
          git push bitbucket main:main --force
