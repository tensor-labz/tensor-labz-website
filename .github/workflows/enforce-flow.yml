name: Enforce Branch Flow

on:
  pull_request:
    branches: [main, staging]

jobs:
  check-source:
    name: Branch flow check
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature → staging → main
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"

          # Production stays protected: only staging can merge into main
          if [ "$TARGET" = "main" ] && [ "$SOURCE" != "staging" ]; then
            echo "❌  PRs to main must come from staging (got: $SOURCE)."
            echo "    Merge your branch → staging first, then open a staging → main PR."
            exit 1
          fi

          # staging accepts any feature branch, but never main merged back down
          if [ "$TARGET" = "staging" ] && [ "$SOURCE" = "main" ]; then
            echo "❌  Don't merge main back into staging."
            exit 1
          fi

          echo "✅  Branch flow OK: $SOURCE → $TARGET"
